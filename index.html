<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
  </head>

  <body>
    <div id="wrapper">
      <header><a href="index.html">Tic Tac Toe</a></header>
      <section id="info">
        <div class="playerinfo">
          <p class="pname">Player 1</p>
          <p class="pscore">0</p>
        </div>
        <div id="msgbox"></div>
        <div class="playerinfo">
          <p class="pname">Player 2</p>
          <p class="pscore">0</p>
        </div>
      </section>
      <main>
        <form>
          <div class="playerform">
            <span>Player 1: </span>
            <input type="text" placeholder="Enter player name">
            <label for="p1x"><input id="p1x" type="radio" name="p1"> X</label>
            <label for="p1o"><input id="p1o" type="radio" name="p1"> O</label>
          </div>
          <div class="playerform">
            <span>Player 2: </span>
            <input type="text" placeholder="Enter player name">
            <label for="p2x"><input id="p2x" type="radio" name="p2"> X</label>
            <label for="p2o"><input id="p2o" type="radio" name="p2"> O</label>
          </div>
          <button id="btnstart" type="submit">Start</button>
        </form>
      </main>
    </div>

  </body>

</html>
